<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Overlay</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent;
            color: #f0f0f0;
            font-family: 'Arial Black', Gadget, sans-serif;
        }

        #chat-column {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        #chat {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            font-size: 16px;
            background: transparent;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .message {
            margin: 10px;
            padding: 10px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            background-color: transparent;
            text-shadow: none;
            animation: slideIn 1s ease-out, fadeOut 25s forwards;
        }

        @keyframes slideIn {
            from {
                transform: translateX(-100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes fadeOut {

            0%,
            95% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }
        }

        .username {
            font-weight: bold;
            margin-right: 10px;
            padding: 5px;
            border-radius: 5px;
            background-color: #ff0000;
            color: #fff;
            display: flex;
            align-items: center;
        }

        .message-text {
            padding: 5px;
            border-radius: 5px;
            background-color: #ffffff;
            color: #000;
            white-space: pre-wrap;
            text-shadow: none;
        }

        .platform-icon,
        .crown-icon {
            width: 20px;
            height: 20px;
            margin-right: 5px;
            flex-shrink: 0;
        }

        .emote {
            width: 28px;
            height: 28px;
            vertical-align: middle;
        }

        .badge-container {
            display: flex;
            align-items: center;
            margin-right: 10px;
        }

        .voice-enabled-icon {
            width: 20px;
            height: 20px;
            margin-right: 5px;
            background-size: contain;
            background-repeat: no-repeat;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23FFA500"><path d="M12 15c1.66 0 3-1.34 3-3V6c0-1.66-1.34-3-3-3S9 4.34 9 6v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V6z"/><path d="M17 12c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-2.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>');
            display: inline-block;
        }

        .rank-badge {
            font-size: 10px;
            padding: 2px 5px;
            border-radius: 3px;
            font-weight: bold;
            margin-left: 5px;
            color: #fff;
        }

        .rank-Novato {
            background-color: #8395a7;
        }

        .rank-RC {
            background: linear-gradient(45deg, #1e90ff, #483d8b);
        }

        .rank-G {
            background: linear-gradient(45deg, #ffD700, #ff8c00);
        }

        .crown-icon {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23ffd700"><path d="M12 2L9.12 8.44L2 9.27l5.46 5.3L6.24 22L12 18.27L17.76 22l-1.22-7.43L22 9.27l-7.12-.83L12 2z"/></svg>');
            background-size: contain;
        }

        .member-icon {
            margin-right: 5px;
            color: #f83d3d;
        }

        #rank-up-animation-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            padding: 50px;
            box-sizing: border-box;
            z-index: 9999;
            pointer-events: none;
        }

        .rank-up-notification {
            padding: 20px 40px;
            border-radius: 15px;
            color: white;
            font-size: 2em;
            text-align: center;
            text-shadow: 2px 2px 4px black;
            animation: rankUp 5s ease-in-out forwards;
        }

        @keyframes rankUp {
            0% {
                transform: scale(0.5) translateX(-50px);
                opacity: 0;
            }

            20% {
                transform: scale(1.1) translateX(0);
                opacity: 1;
            }

            30% {
                transform: scale(1) translateX(0);
                opacity: 1;
            }

            80% {
                transform: scale(1) translateX(0);
                opacity: 1;
            }

            100% {
                transform: scale(0.8) translateX(-50px);
                opacity: 0;
            }
        }
        
        body.banner-mode #chat-column {
            position: fixed;
            height: 80px;
            left: 0;
            right: 0;
        }

        body.banner-mode.banner-bottom #chat-column {
            bottom: 20px;
            top: auto;
        }

        body.banner-mode.banner-top #chat-column {
            top: 20px;
            bottom: auto;
        }

        body.banner-mode #chat {
            flex-direction: row;
            justify-content: flex-start;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #ticker-track {
            display: flex;
            align-items: center;
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            will-change: transform;
        }

        body.banner-mode .message {
            animation: none;
            flex-shrink: 0;
            margin: 0 15px;
            white-space: nowrap;
        }
    </style>
</head>

<body>
    <div id="chat-column">
        <div id="chat"></div>
        <div id="rank-up-animation-container"></div>
    </div>
    <script src="shared.js"></script>
    <script src="https://unpkg.com/@streamerbot/client@1.5.1/dist/streamerbot-client.js"></script>
    <script>
        const chatEl = document.getElementById('chat');
        let speechQueue = [];
        let tickerTrack = null, tickerPosition = 0, lastTimestamp = 0, animationFrameId = null;

        function startTicker() { if (animationFrameId) return; lastTimestamp = performance.now(); animationFrameId = requestAnimationFrame(updateTicker); }
        function stopTicker() { if (animationFrameId) { cancelAnimationFrame(animationFrameId); animationFrameId = null; } }

        function updateTicker(timestamp) {
            if (!tickerTrack) return;
            const deltaTime = (timestamp - lastTimestamp) / 1000;
            lastTimestamp = timestamp;
            tickerPosition -= tickerSpeed * deltaTime;
            tickerTrack.style.transform = `translateX(${tickerPosition}px)`;
            if (tickerTrack.children.length > 0) { const firstMessage = tickerTrack.children[0]; const messageRect = firstMessage.getBoundingClientRect(); if (messageRect.right < 0) { tickerPosition += messageRect.width + parseInt(getComputedStyle(firstMessage).marginRight) * 2; firstMessage.remove(); } }
            if (tickerTrack.children.length === 0) { stopTicker(); tickerPosition = 0; } else { animationFrameId = requestAnimationFrame(updateTicker); }
        }

        function setupBannerMode() { chatEl.innerHTML = ''; tickerTrack = document.createElement('div'); tickerTrack.id = 'ticker-track'; chatEl.appendChild(tickerTrack); tickerPosition = window.innerWidth; tickerTrack.style.transform = `translateX(${tickerPosition}px)`; }
        function teardownBannerMode() { stopTicker(); chatEl.innerHTML = ''; tickerTrack = null; tickerPosition = 0; }

        function setDisplayMode() { document.body.classList.remove('banner-mode', 'banner-top', 'banner-bottom'); if (chatDisplayMode === 'banner') { document.body.classList.add('banner-mode'); if (bannerPosition === 'top') document.body.classList.add('banner-top'); else document.body.classList.add('banner-bottom'); setupBannerMode(); } else { teardownBannerMode(); } }

        function addMessage(platform, displayName, message, badges, emotes, color, profileImageUrl, isMember) {
            const urlPattern = /https?:\/\/[^\s]+/; if (urlPattern.test(message)) return;
            const messageDiv = document.createElement('div'); messageDiv.className = 'message'; const badgeContainer = document.createElement('div'); badgeContainer.className = 'badge-container'; const platformIcon = document.createElement('img'); platformIcon.className = 'platform-icon'; platformIcon.src = platform === 'YouTube' ? 'https://cdn-icons-png.flaticon.com/512/1383/1383260.png' : 'https://cdn-icons-png.flaticon.com/512/15789/15789312.png'; badgeContainer.appendChild(platformIcon); const userData = getUserData(displayName, platform); if (platform !== 'Sistema' && (userData.rank.startsWith('G'))) { const crownIcon = document.createElement('span'); crownIcon.className = 'crown-icon'; badgeContainer.appendChild(crownIcon); } if (hasVoicePermission(displayName, platform)) { const voiceIcon = document.createElement('span'); voiceIcon.className = 'voice-enabled-icon'; badgeContainer.appendChild(voiceIcon); } const usernameSpan = document.createElement('span'); usernameSpan.className = 'username'; if (isMember) { const memberIcon = document.createElement('span'); memberIcon.className = 'member-icon'; memberIcon.textContent = '❤️'; usernameSpan.appendChild(memberIcon); } const nameText = document.createTextNode(displayName); usernameSpan.appendChild(nameText); usernameSpan.style.backgroundColor = color; if (platform !== 'Sistema') { const rankBadge = document.createElement('span'); let rankType = 'Novato'; if (userData.rank.startsWith('RC')) rankType = 'RC'; else if (userData.rank.startsWith('G')) rankType = 'G'; rankBadge.className = `rank-badge rank-${rankType}`; rankBadge.textContent = userData.rank; usernameSpan.appendChild(rankBadge); } const messageContentDiv = document.createElement('div'); messageContentDiv.className = 'message-content'; const processTwitchMessage = (text, msgEmotes) => { let formattedMessage = text; if (msgEmotes) { msgEmotes.forEach(emote => { const emoteTag = `<img src="${emote.imageUrl}" class="emote">`; const emoteRegex = new RegExp(`\\b${emote.name}\\b`, 'g'); formattedMessage = formattedMessage.replace(emoteRegex, emoteTag); }); } return formattedMessage; }; const messageText = document.createElement('div'); messageText.className = 'message-text'; messageText.innerHTML = (platform === 'Twitch') ? processTwitchMessage(message, emotes) : message; messageContentDiv.appendChild(usernameSpan); messageContentDiv.appendChild(messageText); messageDiv.appendChild(badgeContainer); messageDiv.appendChild(messageContentDiv);
            if (chatDisplayMode === 'banner') { if (!tickerTrack) setupBannerMode(); if (tickerTrack.children.length > 0) { const lastMessage = tickerTrack.lastElementChild; const lastMessageRect = lastMessage.getBoundingClientRect(); if (lastMessageRect.right < window.innerWidth) { const gap = window.innerWidth - lastMessageRect.right; messageDiv.style.marginLeft = `${Math.max(15, gap)}px`; } } tickerTrack.appendChild(messageDiv); startTicker(); } else { chatEl.appendChild(messageDiv); if (chatEl.children.length > 30) chatEl.removeChild(chatEl.firstChild); setTimeout(() => { if (messageDiv.parentNode) messageDiv.remove(); }, 25000); }
        }

        function updateRankForChat(displayName, platform) { const userData = getUserData(displayName, platform); const sortedRanks = [...RANKS].sort((a, b) => b.points - a.points); const newRank = sortedRanks.find(r => userData.points >= r.points); if (newRank && userData.rank !== newRank.name) { const oldRank = userData.rank; userData.rank = newRank.name; addMessage('Sistema', 'Bot', `${userData.displayName} ha ascendido de ${oldRank} a ${newRank.name}!`, [], [], '#7289da', '', false); if (newRank.name.startsWith('RC') || newRank.name.startsWith('G')) { showRankUpAnimation(userData.displayName, newRank.name); } } }
        function addPointsForChat(displayName, platform) { const userData = getUserData(displayName, platform); userData.points += POINTS_PER_MESSAGE; updateRankForChat(displayName, platform); }
        function processSpeechQueue() { if (!voiceEnabled || speechQueue.length === 0 || speechSynthesis.speaking) return; loadState(); const messageToSpeak = speechQueue.shift(); const utterance = new SpeechSynthesisUtterance(messageToSpeak); voices = speechSynthesis.getVoices(); const voice = voices.find(v => v.name === selectedVoice) || voices[0]; if (voice) { utterance.voice = voice; utterance.lang = voice.lang; } utterance.volume = volume / 100; utterance.onend = () => processSpeechQueue(); utterance.onerror = (event) => { console.error('TTS Error:', event); processSpeechQueue(); }; speechSynthesis.speak(utterance); }
        function speakMessage(message) { if (!voiceEnabled) { speechQueue = []; speechSynthesis.cancel(); return; } speechQueue.push(message); processSpeechQueue(); }
        function showRankUpAnimation(username, newRank) { const animationContainer = document.getElementById('rank-up-animation-container'); const notification = document.createElement('div'); notification.className = 'rank-up-notification'; if (newRank.startsWith('RC')) notification.classList.add('rc'); else if (newRank.startsWith('G')) notification.classList.add('g'); notification.innerHTML = `¡Felicidades, <strong>${username}</strong>!<br>Has ascendido a ${newRank}`; animationContainer.appendChild(notification); setTimeout(() => notification.remove(), 5000); }
        function processCommand(platform, displayName, message, isOwner) { const [command, ...args] = message.split(' '); const input = args.join(' ').trim(); const lowerInput = input.toLowerCase(); if (command.toLowerCase() === '!rank' || command.toLowerCase() === '!puntos') { const userToCheck = input || displayName; const userData = getUserData(userToCheck, platform); const reply = `${userData.displayName}, es ${userData.rank} con ${userData.points} puntos.`; addMessage('Sistema', 'Bot', reply, [], [], '#7289da', '', false); return; } if (!isOwner) return; switch (command.toLowerCase()) { case '!agregar': if (lowerInput) { manualVoiceUsers.add(lowerInput); addMessage('Sistema', 'Bot', `Permiso de voz manual para "${input}".`, [], [], '#43b581', '', false); } break; case '!eliminar': if (lowerInput) { manualVoiceUsers.delete(lowerInput); addMessage('Sistema', 'Bot', `Permiso de voz manual quitado para "${input}".`, [], [], '#f04747', '', false); } break; case '!setpuntos': const [userToSet, pointsStr] = args; const points = parseInt(pointsStr); if (userToSet && !isNaN(points)) { const userData = getUserData(userToSet, platform); userData.points = points; updateRankForChat(userData.displayName, platform); addMessage('Sistema', 'Bot', `Puntos de ${userData.displayName} establecidos a ${points}.`, [], [], '#7289da', '', false); } break; default: return; } saveState(); }
        
        document.addEventListener('DOMContentLoaded', () => {
            loadState(); setDisplayMode();
            channel.onmessage = (event) => { if (event.data && event.data.type === 'STATE_UPDATED') { const oldDisplayMode = chatDisplayMode; const oldVoiceEnabled = voiceEnabled; loadState(); if (oldDisplayMode !== chatDisplayMode) setDisplayMode(); if (oldVoiceEnabled && !voiceEnabled) { speechQueue = []; speechSynthesis.cancel(); } } };
            const client = new StreamerbotClient({ 
                host: '127.0.0.1', port: 8080, endpoint: '/', 
                subscribe: { 'YouTube': ['Message', 'MembershipGift'], 'Twitch': ['ChatMessage'] }, 
                onData: (data) => { 
                    // Para depuración: Puedes descomentar la siguiente línea para ver en la consola (F12) los datos crudos que llegan.
                    // console.log(JSON.stringify(data, null, 2));
                    let source; 
                    try { 
                        if (data.event.source === 'Twitch' && data.event.type === 'ChatMessage') { 
                            source = 'Twitch'; 
                            const { displayName, message, badges, emotes, color, isBroadcaster } = data.data.message;
                            const isOwner = isBroadcaster;
                            if (!displayName || !message) return; 
                            if (message.startsWith('!')) { 
                                processCommand(source, displayName, message, isOwner); 
                            } else { 
                                addPointsForChat(displayName, source); 
                                const isSub = badges.some(b => b.name === 'subscriber'); 
                                addMessage(source, displayName, message, badges, emotes, color, data.data.message.profileImageUrl, isSub); 
                                if (hasVoicePermission(displayName, source)) speakMessage(`${displayName}: ${message}`); 
                            } 
                        } else if (data.event.source === 'YouTube' && data.event.type === 'Message') { 
                            source = 'YouTube'; 
                            const { displayName, message, color, isOwner } = data.data; 
                            if (!displayName || !message) return;

                            // --- [INICIO DE LA CORRECCIÓN] ---
                            // Hacemos una comprobación segura. Si 'data.data.user' o 'data.data.user.badges' no existen, 'isMember' será 'false'.
                            const isMember = data.data.user && data.data.user.badges ? data.data.user.badges.some(b => b.name === 'member') : false;
                            // Hacemos lo mismo para la URL de la imagen de perfil.
                            const profileImageUrl = data.data.user ? data.data.user.profileImageUrl : ''; 
                            // --- [FIN DE LA CORRECCIÓN] ---

                            if (message.startsWith('!')) { 
                                processCommand(source, displayName, message, isOwner); 
                            } else { 
                                addPointsForChat(displayName, source); 
                                // Pasamos las variables seguras a la función 'addMessage'.
                                addMessage(source, displayName, message, [], [], color, profileImageUrl, isMember); 
                                if (hasVoicePermission(displayName, source)) speakMessage(`${displayName}: ${message}`); 
                            } 
                        } else if (data.event.source === 'YouTube' && data.event.type === 'MembershipGift') { 
                            source = 'YouTube'; 
                            const gifterName = data.data.user.name; 
                            addMessage('Sistema', 'Bot', `${gifterName} ha regalado membresías y gana ${pointsPerGiftedMembership} puntos RC!`, [], [], '#20c25b', '', false); 
                            const gifterData = getUserData(gifterName, source); 
                            gifterData.points += pointsPerGiftedMembership; 
                            updateRankForChat(gifterName, source); 
                        } 
                    } catch (e) { 
                        console.error("Error procesando evento:", e, data); 
                    } 
                    clearTimeout(window.saveTimeout); 
                    window.saveTimeout = setTimeout(() => saveState(), 2000); 
                } 
            }); 
            client.connect();
        });
    </script>
</body>

</html>
