<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Overlay</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: transparent; color: #f0f0f0; font-family: 'Arial Black', Gadget, sans-serif; }
        #chat-column { width: 100%; height: 100vh; overflow: hidden; position: relative; }
        #chat { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; font-size: 16px; background: transparent; display: flex; flex-direction: column; justify-content: flex-end; }
        #announcement-bar-container { position: absolute; bottom: 14px; left: 0; width: 100%; height: 54px; overflow: hidden; pointer-events: none; z-index: 12000; }
        .announcement-bar { position: absolute; left: 100%; top: 0; display: inline-flex; align-items: center; gap: 10px; white-space: nowrap; padding: 12px 20px; border-radius: 12px; background: rgba(20, 20, 20, 0.85); border: 2px solid rgba(255, 220, 120, 0.75); color: #fff4d0; font-size: 20px; font-weight: 700; text-shadow: 0 1px 1px rgba(0, 0, 0, 0.7); box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35); }
        .announcement-prefix { color: #ffe58a; }
        .announcement-bar.active { animation-name: tickerMove; animation-timing-function: linear; animation-fill-mode: forwards; }
        @keyframes tickerMove { from { transform: translateX(0); } to { transform: translateX(calc(-100vw - 120%)); } }
        .message { margin: 10px; padding: 10px; border-radius: 10px; display: flex; align-items: center; background-color: transparent; text-shadow: none; animation: slideIn 1s ease-out, fadeOut 25s forwards; }
        @keyframes slideIn { from { transform: translateX(-100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOut { 0%, 95% { opacity: 1; } 100% { opacity: 0; } }
        .message.noise-overload { animation: slideIn 0.6s ease-out, noiseFadeOut 4.5s forwards; }
        .message.noise-overload .message-text { animation: noiseGlitch 0.55s steps(2, end) infinite; }
        @keyframes noiseFadeOut {
            0% { opacity: 1; filter: blur(0px); transform: translateX(0) scale(1); }
            55% { opacity: 0.95; filter: blur(0.5px); transform: translateX(-2px) scale(0.995); }
            100% { opacity: 0; filter: blur(2px); transform: translateX(-12px) scale(0.96); }
        }
        @keyframes noiseGlitch {
            0% { transform: translateX(0); opacity: 1; }
            25% { transform: translateX(-2px); opacity: 0.92; }
            50% { transform: translateX(2px); opacity: 0.86; }
            75% { transform: translateX(-1px); opacity: 0.93; }
            100% { transform: translateX(0); opacity: 1; }
        }
        .username { font-weight: bold; margin-right: 10px; padding: 5px; border-radius: 5px; background-color: #ff0000; color: #fff; display: flex; align-items: center; }
        .message-text { padding: 5px; border-radius: 5px; background-color: #ffffff; color: #000; white-space: pre-wrap; text-shadow: none; }
        .platform-icon, .crown-icon { width: 20px; height: 20px; margin-right: 5px; }
        .emote { width: 28px; height: 28px; vertical-align: middle; }
        .badge-container { display: flex; align-items: center; margin-right: 10px; }
        .voice-enabled-icon { width: 20px; height: 20px; margin-right: 5px; background-size: contain; background-repeat: no-repeat; background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23FFA500"><path d="M12 15c1.66 0 3-1.34 3-3V6c0-1.66-1.34-3-3-3S9 4.34 9 6v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V6z"/><path d="M17 12c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-2.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>'); display: inline-block; }
        .rank-badge { font-size: 10px; padding: 2px 5px; border-radius: 3px; font-weight: bold; margin-left: 5px; color: #fff; }
        .rank-Novato { background-color: #8395a7; }
        .rank-RC { background: linear-gradient(45deg, #1e90ff, #483d8b); }
        .rank-G { background: linear-gradient(45deg, #ffD700, #ff8c00); }
        .crown-icon { background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23ffd700"><path d="M12 2L9.12 8.44L2 9.27l5.46 5.3L6.24 22L12 18.27L17.76 22l-1.22-7.43L22 9.27l-7.12-.83L12 2z"/></svg>'); background-size: contain; }
        #rank-up-animation-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: flex-start; align-items: flex-start; padding: 50px; box-sizing: border-box; z-index: 9999; pointer-events: none; }
        .rank-up-notification { padding: 20px 40px; border-radius: 15px; color: white; font-size: 2em; text-align: center; text-shadow: 2px 2px 4px black; animation: rankUp 5s ease-in-out forwards; }
        .rank-up-notification.rc { background: linear-gradient(45deg, #1e90ff, #4169e1, #483d8b); }
        .rank-up-notification.g { background: linear-gradient(45deg, #ffd700, #f0e68c, #daa520); }
        @keyframes rankUp { 0% { transform: scale(0.5) translateX(-50px); opacity: 0; } 20% { transform: scale(1.1) translateX(0); opacity: 1; } 30% { transform: scale(1) translateX(0); opacity: 1; } 80% { transform: scale(1) translateX(0); opacity: 1; } 100% { transform: scale(0.8) translateX(-50px); opacity: 0; } }
        .confetti-piece { position: absolute; width: 10px; height: 20px; opacity: 0; animation: fall 5s linear forwards; }
        @keyframes fall { 0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(110vh) rotate(720deg); opacity: 0; } }
    </style>
    <script>const youtubeEmotes = {};</script>
</head>
<body>
    <div id="chat-column">
        <div id="chat"></div>
        <div id="announcement-bar-container"></div>
        <div id="rank-up-animation-container"></div>
    </div>
    <script src="shared.js"></script>
    <script src="https://unpkg.com/@streamerbot/client@1.5.1/dist/streamerbot-client.js"></script>
    <script>
        const chatEl = document.getElementById('chat');
        const announcementContainer = document.getElementById('announcement-bar-container');
        const animationContainer = document.getElementById('rank-up-animation-container');
        let speechQueue = [];
        let currentUtterance = null;
        let lastVoiceEnabledState = null;
        let announcementQueue = [];
        let announcementActive = false;
        let sbClient = null;
        let lastClipCommandTimestamp = 0;

        function setChatHiddenByTicker(isHidden) {
            chatEl.style.display = isHidden ? 'none' : 'flex';
        }

        function escapeRegex(value) {
            return value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function countUnicodeEmoji(text) {
            if (!text) return 0;
            const emojiMatches = text.match(/\p{Extended_Pictographic}/gu);
            return emojiMatches ? emojiMatches.length : 0;
        }

        function countYoutubeNamedEmotes(text) {
            if (!text) return 0;
            let count = 0;
            Object.keys(youtubeEmotes || {}).forEach((token) => {
                const tokenRegex = new RegExp(escapeRegex(token), 'g');
                const matches = text.match(tokenRegex);
                if (matches) count += matches.length;
            });
            return count;
        }

        function countMessageEmotes(platform, message, emotes) {
            const twitchCount = Array.isArray(emotes) ? emotes.length : 0;
            const youtubeNamedCount = platform === 'YouTube' ? countYoutubeNamedEmotes(message) : 0;
            const unicodeCount = countUnicodeEmoji(message);
            return twitchCount + youtubeNamedCount + unicodeCount;
        }

        function resetSpeechState() {
            speechQueue = [];
            currentUtterance = null;
            speechSynthesis.cancel();
        }

        function syncVoiceRuntimeState(force = false) {
            const previousState = lastVoiceEnabledState;
            lastVoiceEnabledState = voiceEnabled;

            if (force || (previousState === true && voiceEnabled === false)) {
                resetSpeechState();
                return;
            }

            if (previousState === false && voiceEnabled === true) {
                processSpeechQueue();
            }
        }

        function stripHtmlTags(text) {
            if (!text) return '';
            return text.replace(/<[^>]*>?/gm, '');
        }

        function queueAnnouncement(platform, displayName, message) {
            if (!announcementBarEnabled) return;

            const safeText = stripHtmlTags(message || '').trim();
            if (!safeText) return;
            if (safeText.length < announcementBarMinChars) return;

            announcementQueue.push({ platform, displayName, message: safeText });
            renderNextAnnouncement();
        }

        function renderNextAnnouncement() {
            if (announcementActive || announcementQueue.length === 0 || !announcementBarEnabled) return;

            const nextItem = announcementQueue.shift();
            const bar = document.createElement('div');
            bar.className = 'announcement-bar';

            bar.innerHTML = `<span class="announcement-prefix">${nextItem.displayName}:</span><span>${nextItem.message}</span>`;
            bar.style.animationDuration = `${announcementBarDurationSec}s`;

            announcementActive = true;
            setChatHiddenByTicker(true);
            announcementContainer.appendChild(bar);
            requestAnimationFrame(() => bar.classList.add('active'));

            let cleaned = false;
            const cleanup = () => {
                if (cleaned) return;
                cleaned = true;
                if (bar.parentNode) bar.remove();
                announcementActive = false;
                if (!announcementBarEnabled && announcementQueue.length === 0) setChatHiddenByTicker(false);
                setTimeout(renderNextAnnouncement, 120);
            };

            bar.addEventListener('animationend', cleanup, { once: true });
            setTimeout(cleanup, (announcementBarDurationSec * 1000) + 200);
        }

        function createConfetti() { 
            const confettiContainer = document.body; 
            const colors = ['#e63946', '#f1faee', '#a8dadc', '#457b9d', '#1d3557', '#ffc300']; 
            for (let i = 0; i < 100; i++) { 
                const piece = document.createElement('div'); 
                piece.className = 'confetti-piece'; 
                piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)]; 
                piece.style.left = Math.random() * 100 + 'vw'; 
                piece.style.top = -20 + 'px'; 
                piece.style.animationDelay = Math.random() * 2 + 's'; 
                piece.style.animationDuration = Math.random() * 3 + 3 + 's'; 
                confettiContainer.appendChild(piece); 
                setTimeout(() => piece.remove(), 6000); 
            } 
        }

        function showRankUpAnimation(username, newRank) { 
            const notification = document.createElement('div'); 
            notification.className = 'rank-up-notification'; 
            if (newRank.startsWith('RC')) notification.classList.add('rc'); 
            else if (newRank.startsWith('G')) notification.classList.add('g'); 
            notification.innerHTML = `¡Felicidades, <strong>${username}</strong>!<br>Has ascendido a ${newRank}`; 
            animationContainer.appendChild(notification); 
            createConfetti(); 
            setTimeout(() => notification.remove(), 5000); 
        }

        function addMessage(platform, displayName, message, badges, emotes, color, profileImageUrl, emoteCount = 0) { 
            const urlPattern = /https?:\/\/[^\s]+/; 
            if (urlPattern.test(message)) return; 

            // Modo exclusivo: si la barra de anuncios está activa, no se renderiza chat normal.
            if (announcementBarEnabled && platform !== 'Sistema') return;
            
            const messageDiv = document.createElement('div'); 
            messageDiv.className = 'message'; 
            
            const badgeContainer = document.createElement('div'); 
            badgeContainer.className = 'badge-container'; 
            
            const platformIcon = document.createElement('img'); 
            platformIcon.className = 'platform-icon'; 
            platformIcon.src = platform === 'YouTube' ? 'https://cdn-icons-png.flaticon.com/512/1383/1383260.png' : platform === 'Twitch' ? 'https://cdn-icons-png.flaticon.com/512/15789/15789312.png' : 'https://static.thenounproject.com/png/1183186-200.png'; 
            badgeContainer.appendChild(platformIcon); 
            
            const userData = getUserData(displayName, platform); 
            if (platform !== 'Sistema' && userData.rank.startsWith('G')) { 
                const crownIcon = document.createElement('span'); 
                crownIcon.className = 'crown-icon'; 
                badgeContainer.appendChild(crownIcon); 
            } 
            
            if (hasVoicePermission(displayName, platform)) { 
                const voiceIcon = document.createElement('span'); 
                voiceIcon.className = 'voice-enabled-icon'; 
                badgeContainer.appendChild(voiceIcon); 
            } 
            
            const usernameSpan = document.createElement('span'); 
            usernameSpan.className = 'username'; 
            usernameSpan.textContent = displayName; 
            usernameSpan.style.backgroundColor = color; 
            
            if(platform !== 'Sistema') { 
                const rankBadge = document.createElement('span'); 
                let rankType = 'Novato'; 
                if (userData.rank.startsWith('RC')) rankType = 'RC'; 
                else if (userData.rank.startsWith('G')) rankType = 'G'; 
                rankBadge.className = `rank-badge rank-${rankType}`; 
                rankBadge.textContent = userData.rank; 
                usernameSpan.appendChild(rankBadge); 
            } 
            
            const messageContentDiv = document.createElement('div'); 
            messageContentDiv.className = 'message-content'; 
            
            const processTwitchMessage = (text, msgEmotes) => { 
                let formattedMessage = text; 
                (msgEmotes || []).forEach(emote => { 
                    const emoteTag = `<img src="${emote.imageUrl}" class="emote">`; 
                    const emoteRegex = new RegExp(`\\b${emote.name}\\b`, 'g'); 
                    formattedMessage = formattedMessage.replace(emoteRegex, emoteTag); 
                }); 
                return formattedMessage; 
            }; 
            
            const messageText = document.createElement('div'); 
            messageText.className = 'message-text'; 
            messageText.innerHTML = (platform === 'Twitch') ? processTwitchMessage(message, emotes) : message; 
            
            messageContentDiv.appendChild(usernameSpan); 
            messageContentDiv.appendChild(messageText); 
            messageDiv.appendChild(badgeContainer); 
            messageDiv.appendChild(messageContentDiv); 

            if (emoteCount >= emoteNoiseThreshold) {
                messageDiv.classList.add('noise-overload');
            }

            chatEl.appendChild(messageDiv); 
            
            if (chatEl.children.length > 30) chatEl.removeChild(chatEl.firstChild); 
            setTimeout(() => { if (messageDiv.parentNode) messageDiv.remove(); }, 25000); 
        }

        function updateRankForChat(displayName, platform) { 
            const userData = getUserData(displayName, platform); 
            const newRank = RANKS.find(r => userData.points >= r.points); 
            if (newRank && userData.rank !== newRank.name) { 
                const oldRank = userData.rank; 
                userData.rank = newRank.name; 
                addMessage('Sistema', 'Bot', `${userData.displayName} ha ascendido de ${oldRank} a ${newRank.name}!`, [], [], '#7289da', ''); 
                if (newRank.name.startsWith('RC') || newRank.name.startsWith('G')) { 
                    showRankUpAnimation(userData.displayName, newRank.name); 
                } 
            } 
        }

        function addPointsForChat(displayName, platform) { 
            const userData = getUserData(displayName, platform); 
            userData.points += POINTS_PER_MESSAGE; 
            updateRankForChat(displayName, platform); 
        }

        // CORRECCIÓN: Mejorar el sistema de TTS con carga de voces
        function processSpeechQueue() { 
            if (!voiceEnabled || speechQueue.length === 0 || speechSynthesis.speaking) return; 
            
            loadState(); // Asegurar que tenemos el estado más reciente
            
            const queuedSpeech = speechQueue.shift(); 
            const utterance = new SpeechSynthesisUtterance(queuedSpeech.text); 
            
            voices = speechSynthesis.getVoices(); 
            
            // CORRECCIÓN: Buscar la voz guardada o usar la primera disponible
            let voice = null;
            if (selectedVoice) {
                voice = voices.find(v => v.name === selectedVoice);
                if (!voice) {
                    console.warn(`Voz guardada "${selectedVoice}" no encontrada. Usando voz por defecto.`);
                }
            }
            
            if (!voice && voices.length > 0) {
                voice = voices[0];
            }
            
            if (voice) { 
                utterance.voice = voice; 
                utterance.lang = voice.lang; 
                console.log(`Usando voz: ${voice.name} (${voice.lang})`);
            } 
            
            const volumeMultiplier = queuedSpeech.volumeMultiplier || 1;
            const finalVolume = Math.max(0, Math.min(1, (volume / 100) * volumeMultiplier));
            utterance.volume = finalVolume;
            utterance.onend = () => {
                currentUtterance = null;
                processSpeechQueue();
            }; 
            utterance.onerror = (event) => { 
                console.error('TTS Error:', event); 
                currentUtterance = null;
                processSpeechQueue(); 
            }; 
            
            currentUtterance = utterance;
            speechSynthesis.speak(utterance); 
        }

        function speakMessage(message, options = {}) { 
            speechQueue.push({ text: message, volumeMultiplier: options.volumeMultiplier || 1 }); 
            processSpeechQueue(); 
        }

        function hasClipPermission(eventData) {
            if (!clipOnlyMods) return true;
            if (eventData.isBroadcaster || eventData.isOwner || eventData.isModerator) return true;

            const badgeNames = (eventData.badges || []).map((badge) => {
                if (typeof badge === 'string') return badge.toLowerCase();
                const value = badge?.name || badge?.id || '';
                return String(value).toLowerCase();
            });

            return badgeNames.some((name) =>
                name.includes('broadcaster') ||
                name.includes('owner') ||
                name.includes('moderator') ||
                name.includes('mod')
            );
        }

        async function triggerClipAction(source, displayName) {
            if (!clipCommandEnabled) {
                addMessage('Sistema', 'Bot', 'El comando !clip esta desactivado en el panel.', [], [], '#f04747', '');
                return;
            }

            if (!sbClient) {
                addMessage('Sistema', 'Bot', 'No hay conexion activa con Streamer.bot.', [], [], '#f04747', '');
                return;
            }

            const now = Date.now();
            const elapsed = now - lastClipCommandTimestamp;
            const cooldownMs = clipCommandCooldownSec * 1000;

            if (elapsed < cooldownMs) {
                const secondsLeft = Math.ceil((cooldownMs - elapsed) / 1000);
                addMessage('Sistema', 'Bot', `!clip en cooldown: espera ${secondsLeft}s.`, [], [], '#faa61a', '');
                return;
            }

            const actionName = (clipActionName || '').trim();
            if (!actionName) {
                addMessage('Sistema', 'Bot', 'Configura el nombre de accion !clip en el panel.', [], [], '#f04747', '');
                return;
            }

            try {
                await sbClient.doAction({ name: actionName }, { source, requestedBy: displayName, command: '!clip' });
                lastClipCommandTimestamp = now;
                addMessage('Sistema', 'Bot', `Clip solicitado por ${displayName}.`, [], [], '#43b581', '');
            } catch (error) {
                console.error('Error ejecutando accion !clip:', error);
                addMessage('Sistema', 'Bot', `No se pudo ejecutar la accion "${actionName}".`, [], [], '#f04747', '');
            }
        }

        function processCommand(platform, displayName, message, isOwner, eventData = {}) { 
            const [command, ...args] = message.split(' '); 
            const input = args.join(' ').trim(); 
            const lowerInput = input.toLowerCase(); 
            
            if (command.toLowerCase() === '!rank' || command.toLowerCase() === '!puntos') { 
                const userToCheck = input || displayName; 
                const userData = getUserData(userToCheck, platform); 
                const reply = `${userData.displayName}, es ${userData.rank} con ${userData.points} puntos.`; 
                addMessage('Sistema', 'Bot', reply, [], [], '#7289da', ''); 
                return; 
            } 

            if (command.toLowerCase() === '!clip') {
                const clipArg = (args[0] || '').toLowerCase();

                if (clipArg === 'on' || clipArg === 'off') {
                    if (!isOwner) {
                        addMessage('Sistema', 'Bot', `${displayName}, solo el owner puede usar !clip on/off.`, [], [], '#f04747', '');
                        return;
                    }

                    clipCommandEnabled = clipArg === 'on';
                    saveState();
                    addMessage('Sistema', 'Bot', `Comando !clip ${clipCommandEnabled ? 'activado' : 'desactivado'} por ${displayName}.`, [], [], '#43b581', '');
                    return;
                }

                if (clipArg === 'public' || clipArg === 'all') {
                    if (!isOwner) {
                        addMessage('Sistema', 'Bot', `${displayName}, solo el owner puede cambiar permisos de !clip.`, [], [], '#f04747', '');
                        return;
                    }

                    clipOnlyMods = false;
                    saveState();
                    addMessage('Sistema', 'Bot', 'Ahora !clip puede usarlo todo el chat (con cooldown).', [], [], '#43b581', '');
                    return;
                }

                if (clipArg === 'mods' || clipArg === 'mod') {
                    if (!isOwner) {
                        addMessage('Sistema', 'Bot', `${displayName}, solo el owner puede cambiar permisos de !clip.`, [], [], '#f04747', '');
                        return;
                    }

                    clipOnlyMods = true;
                    saveState();
                    addMessage('Sistema', 'Bot', 'Ahora !clip solo lo pueden usar mods/owner.', [], [], '#43b581', '');
                    return;
                }

                if (clipArg === 'cd' || clipArg === 'cooldown') {
                    if (!isOwner) {
                        addMessage('Sistema', 'Bot', `${displayName}, solo el owner puede cambiar el cooldown de !clip.`, [], [], '#f04747', '');
                        return;
                    }

                    const seconds = parseInt(args[1]);
                    if (isNaN(seconds) || seconds < 5 || seconds > 300) {
                        addMessage('Sistema', 'Bot', 'Uso: !clip cd <segundos> (5 a 300).', [], [], '#faa61a', '');
                        return;
                    }

                    clipCommandCooldownSec = seconds;
                    saveState();
                    addMessage('Sistema', 'Bot', `Cooldown de !clip actualizado a ${seconds}s.`, [], [], '#43b581', '');
                    return;
                }

                if (clipArg === 'status') {
                    const mode = clipOnlyMods ? 'mods/owner' : 'publico';
                    const enabled = clipCommandEnabled ? 'ON' : 'OFF';
                    addMessage('Sistema', 'Bot', `!clip ${enabled} | modo: ${mode} | cooldown: ${clipCommandCooldownSec}s`, [], [], '#7289da', '');
                    return;
                }

                if (!hasClipPermission(eventData)) {
                    addMessage('Sistema', 'Bot', `${displayName}, no tienes permiso para usar !clip.`, [], [], '#f04747', '');
                    return;
                }

                triggerClipAction(platform, displayName);
                return;
            }
            
            if (!isOwner) return; 
            
            switch (command.toLowerCase()) { 
                case '!agregar': 
                    if (lowerInput) { 
                        manualVoiceUsers.add(lowerInput); 
                        addMessage('Sistema', 'Bot', `Permiso de voz manual para "${input}".`, [], [], '#43b581', ''); 
                    } 
                    break; 
                case '!eliminar': 
                    if (lowerInput) { 
                        manualVoiceUsers.delete(lowerInput); 
                        addMessage('Sistema', 'Bot', `Permiso de voz manual quitado para "${input}".`, [], [], '#f04747', ''); 
                    } 
                    break; 
                case '!setpuntos': 
                    const [userToSet, pointsStr] = args; 
                    const points = parseInt(pointsStr); 
                    if (userToSet && !isNaN(points)) { 
                        const userData = getUserData(userToSet, platform); 
                        userData.points = points; 
                        updateRankForChat(userData.displayName, platform); 
                        addMessage('Sistema', 'Bot', `Puntos de ${userData.displayName} establecidos a ${points}.`, [], [], '#7289da', ''); 
                    } 
                    break; 
                default: 
                    return; 
            } 
            saveState(); 
        }

        async function sendToLyra(data) {
            try {
                await fetch('http://localhost:8989/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                console.log('Message sent to Lyra:', data);
            } catch (error) {
                console.error('Failed to send message to Lyra:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', () => { 
            loadState(); 
            syncVoiceRuntimeState(true);
            
            // Cargar las voces al inicio
            speechSynthesis.getVoices();
            if (speechSynthesis.onvoiceschanged !== undefined) {
                speechSynthesis.onvoiceschanged = () => {
                    voices = speechSynthesis.getVoices();
                    console.log(`${voices.length} voces disponibles en el chat.`);
                };
            }
            
            channel.onmessage = (event) => { 
                if (event.data && event.data.type === 'STATE_UPDATED') { 
                    console.log('Chat: Estado actualizado desde el panel.'); 
                    loadState(); 
                    syncVoiceRuntimeState();

                    if (!announcementBarEnabled) {
                        announcementQueue = [];
                        announcementActive = false;
                        announcementContainer.innerHTML = '';
                        setChatHiddenByTicker(false);
                    } else {
                        // Al activar barra, ocultar chat inmediatamente para modo exclusivo.
                        setChatHiddenByTicker(true);
                        renderNextAnnouncement();
                    }
                } 
            }; 
            
            const client = new StreamerbotClient({ 
                host: '127.0.0.1', 
                port: 4456, 
                endpoint: '/', 
                subscribe: { 
                    'YouTube': ['Message', 'SuperChat', 'SuperSticker', 'MembershipGift', 'NewSponsor'],
                    'Twitch': ['ChatMessage', 'Cheer', 'GiftBomb', 'GiftSub', 'ReSub', 'Sub', 'Follow', 'Raid']
                }, 
                onData: (data) => {
                    // === ENVIAR TODOS LOS EVENTOS AL PANEL PARA LOGGING ===
                    channel.postMessage({ 
                        type: 'STREAMERBOT_EVENT',
                        eventData: data
                    });
                    
                    let eventData, source; 
                    try { 
                        if (data.event.source === 'Twitch' && data.event.type === 'ChatMessage') { 
                            eventData = data.data.message; 
                            source = 'Twitch'; 
                        } else if (data.event.source === 'YouTube' && data.event.type === 'Message') { 
                            eventData = { 
                                ...data.data.user, 
                                ...data.data, 
                                displayName: data.data.user.name, 
                                isBroadcaster: data.data.user.isOwner 
                            }; 
                            source = 'YouTube'; 
                        } else { 
                            return; 
                        } 
                    } catch (e) { 
                        return; 
                    } 
                    
                    const { displayName, message, badges = [], emotes = [], color = '#FF0000', isBroadcaster, isOwner } = eventData; 
                    
                    if (!displayName || !message) return; 
                    
                    if (message.startsWith('!')) { 
                            processCommand(source, displayName, message, isBroadcaster || isOwner, eventData); 
                    } else { 
                        const emoteCount = countMessageEmotes(source, message, emotes);
                        const isNoiseMessage = emoteCount >= emoteNoiseThreshold;

                        addPointsForChat(displayName, source); 
                        addMessage(source, displayName, message, badges, emotes, color, eventData.profileImageUrl || '', emoteCount); 
                        queueAnnouncement(source, displayName, message);
                        
                        const lyraPayload = {
                            username: displayName,
                            message: message,
                            platform: source
                        };
                        sendToLyra(lyraPayload);
                        
                        // CORRECCIÓN: Solo usar TTS si el usuario tiene permiso
                        // El bot del sistema nunca debe usar TTS
                        if (hasVoicePermission(displayName, source)) {
                            const volumeMultiplier = isNoiseMessage ? (1 - (emoteNoiseReductionPercent / 100)) : 1;
                            speakMessage(`${displayName}: ${message}`, { volumeMultiplier });
                        }
                        
                        clearTimeout(window.saveTimeout); 
                        window.saveTimeout = setTimeout(() => saveState(), 2000); 
                    } 
                } 
            }); 
            
            sbClient = client;
            client.connect(); 
        });
    </script>
</body>
</html>
