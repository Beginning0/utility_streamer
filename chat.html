<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Overlay</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: transparent; color: #f0f0f0; font-family: 'Arial Black', Gadget, sans-serif; }
        #chat-column { width: 100%; height: 100vh; overflow: hidden; position: relative; }
        #chat { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; font-size: 16px; background: transparent; display: flex; flex-direction: column; justify-content: flex-end; }
        
        /* --- CORRECCIÓN DE ESTILOS --- */
        .message {
            margin: 10px;
            padding: 10px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            background-color: transparent; /* MODIFICADO: Fondo ahora es transparente */
            text-shadow: none; /* MODIFICADO: Se quita la sombra del texto */
            animation: slideIn 1s ease-out, fadeOut 25s forwards;
        }
        /* --- FIN DE LA CORRECCIÓN --- */

        @keyframes slideIn { from { transform: translateX(-100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOut { 0%, 95% { opacity: 1; } 100% { opacity: 0; } }
        .username { font-weight: bold; margin-right: 10px; padding: 5px; border-radius: 5px; background-color: #ff0000; color: #fff; display: flex; align-items: center; }
        .message-text { padding: 5px; border-radius: 5px; background-color: #ffffff; color: #000; white-space: pre-wrap; text-shadow: none; }
        .platform-icon, .crown-icon { width: 20px; height: 20px; margin-right: 5px; }
        .emote { width: 28px; height: 28px; vertical-align: middle; }
        .badge-container { display: flex; align-items: center; margin-right: 10px; }
        .voice-enabled-icon { width: 20px; height: 20px; margin-right: 5px; background-size: contain; background-repeat: no-repeat; background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23FFA500"><path d="M12 15c1.66 0 3-1.34 3-3V6c0-1.66-1.34-3-3-3S9 4.34 9 6v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V6z"/><path d="M17 12c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-2.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>'); display: inline-block; }
        .rank-badge { font-size: 10px; padding: 2px 5px; border-radius: 3px; font-weight: bold; margin-left: 5px; color: #fff; }
        .rank-Novato { background-color: #8395a7; }
        .rank-RC { background: linear-gradient(45deg, #1e90ff, #483d8b); }
        .rank-G { background: linear-gradient(45deg, #ffD700, #ff8c00); }
        .crown-icon { background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23ffd700"><path d="M12 2L9.12 8.44L2 9.27l5.46 5.3L6.24 22L12 18.27L17.76 22l-1.22-7.43L22 9.27l-7.12-.83L12 2z"/></svg>'); background-size: contain; }
        #rank-up-animation-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: flex-start; align-items: flex-start; padding: 50px; box-sizing: border-box; z-index: 9999; pointer-events: none; }
        .rank-up-notification { padding: 20px 40px; border-radius: 15px; color: white; font-size: 2em; text-align: center; text-shadow: 2px 2px 4px black; animation: rankUp 5s ease-in-out forwards; }
        .rank-up-notification.rc { background: linear-gradient(45deg, #1e90ff, #4169e1, #483d8b); }
        .rank-up-notification.g { background: linear-gradient(45deg, #ffd700, #f0e68c, #daa520); }
        @keyframes rankUp { 0% { transform: scale(0.5) translateX(-50px); opacity: 0; } 20% { transform: scale(1.1) translateX(0); opacity: 1; } 30% { transform: scale(1) translateX(0); opacity: 1; } 80% { transform: scale(1) translateX(0); opacity: 1; } 100% { transform: scale(0.8) translateX(-50px); opacity: 0; } }
        .confetti-piece { position: absolute; width: 10px; height: 20px; opacity: 0; animation: fall 5s linear forwards; }
        @keyframes fall { 0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(110vh) rotate(720deg); opacity: 0; } }
    </style>
    <script>const youtubeEmotes = {};</script>
</head>
<body>
    <div id="chat-column">
        <div id="chat"></div>
        <div id="rank-up-animation-container"></div>
    </div>
    <script src="shared.js"></script>
    <script src="https://unpkg.com/@streamerbot/client@1.5.1/dist/streamerbot-client.js"></script>
    <script>
        const chatEl = document.getElementById('chat');
        const animationContainer = document.getElementById('rank-up-animation-container');
        let speechQueue = [];
        function createConfetti() { const confettiContainer = document.body; const colors = ['#e63946', '#f1faee', '#a8dadc', '#457b9d', '#1d3557', '#ffc300']; for (let i = 0; i < 100; i++) { const piece = document.createElement('div'); piece.className = 'confetti-piece'; piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)]; piece.style.left = Math.random() * 100 + 'vw'; piece.style.top = -20 + 'px'; piece.style.animationDelay = Math.random() * 2 + 's'; piece.style.animationDuration = Math.random() * 3 + 3 + 's'; confettiContainer.appendChild(piece); setTimeout(() => piece.remove(), 6000); } }
        function showRankUpAnimation(username, newRank) { const notification = document.createElement('div'); notification.className = 'rank-up-notification'; if (newRank.startsWith('RC')) notification.classList.add('rc'); else if (newRank.startsWith('G')) notification.classList.add('g'); notification.innerHTML = `¡Felicidades, <strong>${username}</strong>!<br>Has ascendido a ${newRank}`; animationContainer.appendChild(notification); createConfetti(); setTimeout(() => notification.remove(), 5000); }
        function addMessage(platform, displayName, message, badges, emotes, color, profileImageUrl) { const urlPattern = /https?:\/\/[^\s]+/; if (urlPattern.test(message)) return; const messageDiv = document.createElement('div'); messageDiv.className = 'message'; const badgeContainer = document.createElement('div'); badgeContainer.className = 'badge-container'; const platformIcon = document.createElement('img'); platformIcon.className = 'platform-icon'; platformIcon.src = platform === 'YouTube' ? 'https://cdn-icons-png.flaticon.com/512/1383/1383260.png' : platform === 'Twitch' ? 'https://cdn-icons-png.flaticon.com/512/15789/15789312.png' : 'https://static.thenounproject.com/png/1183186-200.png'; badgeContainer.appendChild(platformIcon); const userData = getUserData(displayName, platform); if (platform !== 'Sistema' && userData.rank.startsWith('G')) { const crownIcon = document.createElement('span'); crownIcon.className = 'crown-icon'; badgeContainer.appendChild(crownIcon); } if (hasVoicePermission(displayName, platform)) { const voiceIcon = document.createElement('span'); voiceIcon.className = 'voice-enabled-icon'; badgeContainer.appendChild(voiceIcon); } const usernameSpan = document.createElement('span'); usernameSpan.className = 'username'; usernameSpan.textContent = displayName; usernameSpan.style.backgroundColor = color; if(platform !== 'Sistema') { const rankBadge = document.createElement('span'); let rankType = 'Novato'; if (userData.rank.startsWith('RC')) rankType = 'RC'; else if (userData.rank.startsWith('G')) rankType = 'G'; rankBadge.className = `rank-badge rank-${rankType}`; rankBadge.textContent = userData.rank; usernameSpan.appendChild(rankBadge); } const messageContentDiv = document.createElement('div'); messageContentDiv.className = 'message-content'; const processTwitchMessage = (text, msgEmotes) => { let formattedMessage = text; (msgEmotes || []).forEach(emote => { const emoteTag = `<img src="${emote.imageUrl}" class="emote">`; const emoteRegex = new RegExp(`\\b${emote.name}\\b`, 'g'); formattedMessage = formattedMessage.replace(emoteRegex, emoteTag); }); return formattedMessage; }; const messageText = document.createElement('div'); messageText.className = 'message-text'; messageText.innerHTML = (platform === 'Twitch') ? processTwitchMessage(message, emotes) : message; messageContentDiv.appendChild(usernameSpan); messageContentDiv.appendChild(messageText); messageDiv.appendChild(badgeContainer); messageDiv.appendChild(messageContentDiv); chatEl.appendChild(messageDiv); if (chatEl.children.length > 30) chatEl.removeChild(chatEl.firstChild); setTimeout(() => { if (messageDiv.parentNode) messageDiv.remove(); }, 25000); }
        function updateRankForChat(displayName, platform) { const userData = getUserData(displayName, platform); const newRank = RANKS.find(r => userData.points >= r.points); if (newRank && userData.rank !== newRank.name) { const oldRank = userData.rank; userData.rank = newRank.name; addMessage('Sistema', 'Bot', `${userData.displayName} ha ascendido de ${oldRank} a ${newRank.name}!`, [], [], '#7289da', ''); if (newRank.name.startsWith('RC') || newRank.name.startsWith('G')) { showRankUpAnimation(userData.displayName, newRank.name); } } }
        function addPointsForChat(displayName, platform) { const userData = getUserData(displayName, platform); userData.points += POINTS_PER_MESSAGE; updateRankForChat(displayName, platform); }
        function processSpeechQueue() { if (!voiceEnabled || speechQueue.length === 0 || speechSynthesis.speaking) return; loadState(); const messageToSpeak = speechQueue.shift(); const utterance = new SpeechSynthesisUtterance(messageToSpeak); voices = speechSynthesis.getVoices(); const voice = voices.find(v => v.name === selectedVoice) || voices[0]; if (voice) { utterance.voice = voice; utterance.lang = voice.lang; } utterance.volume = volume / 100; utterance.onend = () => processSpeechQueue(); utterance.onerror = (event) => { console.error('TTS Error:', event); processSpeechQueue(); }; speechSynthesis.speak(utterance); }
        function speakMessage(message) { speechQueue.push(message); processSpeechQueue(); }
        function processCommand(platform, displayName, message, isOwner) { const [command, ...args] = message.split(' '); const input = args.join(' ').trim(); const lowerInput = input.toLowerCase(); if (command.toLowerCase() === '!rank' || command.toLowerCase() === '!puntos') { const userToCheck = input || displayName; const userData = getUserData(userToCheck, platform); const reply = `${userData.displayName}, es ${userData.rank} con ${userData.points} puntos.`; addMessage('Sistema', 'Bot', reply, [], [], '#7289da', ''); return; } if (!isOwner) return; switch (command.toLowerCase()) { case '!agregar': if (lowerInput) { manualVoiceUsers.add(lowerInput); addMessage('Sistema', 'Bot', `Permiso de voz manual para "${input}".`, [], [], '#43b581', ''); } break; case '!eliminar': if (lowerInput) { manualVoiceUsers.delete(lowerInput); addMessage('Sistema', 'Bot', `Permiso de voz manual quitado para "${input}".`, [], [], '#f04747', ''); } break; case '!setpuntos': const [userToSet, pointsStr] = args; const points = parseInt(pointsStr); if (userToSet && !isNaN(points)) { const userData = getUserData(userToSet, platform); userData.points = points; updateRankForChat(userData.displayName, platform); addMessage('Sistema', 'Bot', `Puntos de ${userData.displayName} establecidos a ${points}.`, [], [], '#7289da', ''); } break; default: return; } saveState(); }
        document.addEventListener('DOMContentLoaded', () => { loadState(); channel.onmessage = (event) => { if (event.data && event.data.type === 'STATE_UPDATED') { console.log('Chat: Estado actualizado desde el panel.'); loadState(); } }; const client = new StreamerbotClient({ host: '127.0.0.1', port: 8080, endpoint: '/', subscribe: { 'YouTube': ['Message'], 'Twitch': ['ChatMessage'] }, onData: (data) => { let eventData, source; try { if (data.event.source === 'Twitch' && data.event.type === 'ChatMessage') { eventData = data.data.message; source = 'Twitch'; } else if (data.event.source === 'YouTube' && data.event.type === 'Message') { eventData = { ...data.data.user, ...data.data, displayName: data.data.user.name, isBroadcaster: data.data.user.isOwner }; source = 'YouTube'; } else { return; } } catch (e) { return; } const { displayName, message, badges = [], emotes = [], color = '#FF0000', isBroadcaster, isOwner } = eventData; if (!displayName || !message) return; if (message.startsWith('!')) { processCommand(source, displayName, message, isBroadcaster || isOwner); } else { addPointsForChat(displayName, source); addMessage(source, displayName, message, badges, emotes, color, eventData.profileImageUrl || ''); if (hasVoicePermission(displayName, source)) { speakMessage(message.replace(/dice:/g, '')); } clearTimeout(window.saveTimeout); window.saveTimeout = setTimeout(() => saveState(), 2000); } } }); client.connect(); });
    </script>
</body>
</html>
